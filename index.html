<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis Finanzas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#F2F3F9;
    --surface:#FFFFFF;
    --surface-soft:#F8F9FD;
    --border:#E9EAF3;
    --text:#171826;
    --text-secondary:#8B8DA1;
    --text-tertiary:#B7B9CC;
    --primary:#6C5CE7;
    --primary-dark:#5A4BD1;
    --primary-light:#EEEBFD;
    --teal:#1FBF9E;
    --teal-light:#E1F9F3;
    --coral:#FF6767;
    --coral-light:#FFEBEB;
    --blue:#4F8EF7;
    --blue-light:#EAF2FE;
    --amber:#FFB020;
    --amber-light:#FFF5E2;
    --radius-lg:22px;
    --radius-md:16px;
    --font-display:'Outfit',sans-serif;
    --font-body:'Inter',sans-serif;
    --shadow-card:0 1px 2px rgba(23,24,38,.04), 0 12px 24px -14px rgba(23,24,38,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    font-size:15px;
    line-height:1.45;
  }
  button{font-family:inherit;cursor:pointer;}
  a{text-decoration:none;color:inherit;}
  h1,h2,h3{margin:0;}
  p{margin:0;}
  svg{display:block;}

  /* ---------- Layout ---------- */
  #app{display:flex;min-height:100vh;align-items:stretch;}
  .sidebar{
    width:252px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
    padding:26px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{display:flex;align-items:center;gap:11px;margin-bottom:32px;padding:0 8px;}
  .brand-icon{
    width:38px;height:38px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--primary),var(--teal));
    display:flex;align-items:center;justify-content:center;color:#fff;
  }
  .brand-icon svg{width:19px;height:19px;}
  .brand-name{font-family:var(--font-display);font-weight:700;font-size:17.5px;letter-spacing:-.02em;}

  .nav{display:flex;flex-direction:column;gap:3px;}
  .nav-item{
    display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:12px;
    color:var(--text-secondary);font-weight:500;font-size:14px;cursor:pointer;
    transition:background .15s,color .15s;user-select:none;
  }
  .nav-item svg{width:18px;height:18px;flex-shrink:0;}
  .nav-item:hover{background:var(--surface-soft);color:var(--text);}
  .nav-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:600;}

  .main{flex:1;min-width:0;padding:26px 32px 110px;max-width:1360px;}
  .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .page-title{font-family:var(--font-display);font-size:25px;font-weight:700;letter-spacing:-.02em;}
  .page-sub{color:var(--text-secondary);font-size:13.3px;margin-top:3px;}

  .sync-badge{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:20px;background:var(--surface-soft);border:1px solid var(--border);color:var(--text-secondary);font-size:12.2px;font-weight:600;flex-shrink:0;white-space:nowrap;}
  .sync-badge svg{width:14px;height:14px;}
  .sync-badge.connected{background:var(--teal-light);color:#0F9E82;border-color:transparent;}
  .sync-badge.syncing svg{animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font-body);font-weight:600;font-size:13.3px;border-radius:12px;
    padding:10px 17px;border:1px solid transparent;cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;transition:filter .15s,transform .15s,background .15s;
    white-space:nowrap;
  }
  .btn svg{width:15px;height:15px;flex-shrink:0;}
  .btn-primary{background:linear-gradient(135deg,var(--primary),#8171F0);color:#fff;box-shadow:0 8px 18px -7px rgba(108,92,231,.6);}
  .btn-primary:hover{filter:brightness(1.06);transform:translateY(-1px);}
  .btn-ghost{background:var(--surface-soft);color:var(--text);border-color:var(--border);}
  .btn-ghost:hover{background:var(--border);}
  .btn-danger{background:var(--coral-light);color:#D93B3B;}
  .btn-danger:hover{filter:brightness(.97);}
  .btn-sm{padding:8px 12px;font-size:12.5px;border-radius:10px;}
  .btn-block{width:100%;justify-content:center;}
  .icon-btn{
    width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;
    color:var(--text-secondary);background:transparent;border:1px solid transparent;flex-shrink:0;
  }
  .icon-btn svg{width:15.5px;height:15.5px;}
  .icon-btn:hover{background:var(--surface-soft);color:var(--text);border-color:var(--border);}

  /* ---------- Cards / generic ---------- */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow-card);}
  .section-actions{display:flex;justify-content:flex-end;gap:10px;margin-bottom:18px;flex-wrap:wrap;}
  .section-title{font-family:var(--font-display);font-weight:600;font-size:14.5px;color:var(--text-secondary);margin-bottom:12px;}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.8px;font-weight:600;}
  .row-actions{display:flex;gap:4px;}

  /* ---------- Stat cards ---------- */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:18px;}
  .stat-card{padding:20px;}
  .stat-icon{width:37px;height:37px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;}
  .stat-icon svg{width:18px;height:18px;}
  .stat-label{color:var(--text-secondary);font-size:12.6px;font-weight:500;margin-bottom:5px;}
  .stat-value{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.01em;}
  .trend-pill{display:inline-flex;align-items:center;gap:3px;font-size:11.2px;font-weight:700;padding:3px 8px;border-radius:20px;margin-top:9px;}
  .trend-pill svg{width:10.5px;height:10.5px;}
  .trend-up{background:var(--teal-light);color:#0F9E82;}
  .trend-down{background:var(--coral-light);color:#E1444B;}
  .stat-sub{display:inline-block;font-size:11.5px;color:var(--text-tertiary);margin-top:9px;font-weight:500;}

  /* ---------- Charts ---------- */
  .charts-row{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-bottom:18px;align-items:stretch;}
  .chart-card{display:flex;flex-direction:column;}
  .chart-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;gap:8px;flex-wrap:wrap;}
  .chart-head h3{font-family:var(--font-display);font-weight:600;font-size:15px;}
  .chart-sub{font-size:11.8px;color:var(--text-secondary);}
  .range-select{width:auto;padding:5px 10px;font-size:11.8px;font-weight:600;color:var(--text-secondary);border-radius:8px;border:1px solid var(--border);background:var(--surface-soft);}
  .range-select:focus{outline:none;border-color:var(--primary);}
  .chart-wrap{height:250px;position:relative;}
  .donut-wrap{display:flex;gap:22px;align-items:center;flex-wrap:wrap;flex:1;}
  .donut-canvas-wrap{width:168px;height:168px;position:relative;flex-shrink:0;margin:0 auto;}
  .donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;}
  .donut-total{display:block;font-family:var(--font-display);font-weight:700;font-size:16px;}
  .donut-total-label{font-size:10.5px;color:var(--text-secondary);}
  .legend-list{flex:1;min-width:150px;}
  .legend-row{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:12.8px;}
  .legend-row+.legend-row{border-top:1px solid var(--border);}
  .legend-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
  .legend-name{flex:1;color:var(--text);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend-amount{font-weight:700;color:var(--text);font-family:var(--font-display);font-size:12px;flex-shrink:0;}

  /* ---------- Transaction rows ---------- */
  .tx-icon{
    width:37px;height:37px;border-radius:11px;display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:13.5px;flex-shrink:0;
  }
  .tx-row{display:flex;align-items:center;gap:12px;padding:11px 2px;}
  .tx-row+.tx-row{border-top:1px solid var(--border);}
  .tx-full-row{display:flex;align-items:center;gap:12px;padding:12px 2px;flex-wrap:wrap;}
  .tx-full-row+.tx-full-row{border-top:1px solid var(--border);}
  .tx-info{flex:1;min-width:120px;}
  .tx-desc{font-weight:600;font-size:13.6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .tx-meta{font-size:11.8px;color:var(--text-secondary);margin-top:2px;}
  .tx-cat-pill{flex-shrink:0;}
  .tx-amount{font-weight:700;font-size:13.8px;font-family:var(--font-display);white-space:nowrap;flex-shrink:0;margin-left:auto;}
  .tx-full-row .tx-amount{margin-left:0;}
  .tx-amount.positive{color:#0F9E82;}
  .tx-amount.negative{color:#E1444B;}

  /* ---------- Account / pocket / category cards ---------- */
  .accounts-grid,.pockets-grid,.categories-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:14px;}
  .cc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;}
  .account-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
  .account-name{font-weight:600;font-size:14px;color:var(--text-secondary);margin-bottom:4px;}
  .account-balance{font-family:var(--font-display);font-weight:700;font-size:21px;margin-bottom:10px;letter-spacing:-.01em;}
  .cat-dot-lg{width:37px;height:37px;border-radius:11px;display:inline-block;}
  .pocket-actions{display:flex;gap:8px;margin-top:14px;}
  .pocket-actions .btn{flex:1;justify-content:center;}

  /* ---------- Credit card ---------- */
  .cc-block{display:flex;flex-direction:column;}
  .credit-card{
    position:relative;overflow:hidden;border-radius:20px;padding:22px 24px;color:#fff;
    background:linear-gradient(135deg,#6C5CE7 0%,#5A4BD1 55%,#1FBF9E 130%);
    aspect-ratio:1.586;display:flex;flex-direction:column;justify-content:space-between;
    box-shadow:0 18px 34px -12px rgba(90,75,209,.55);
  }
  .credit-card::before{
    content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;
    background:rgba(255,255,255,.10);
  }
  .credit-card::after{
    content:'';position:absolute;bottom:-60px;left:-30px;width:180px;height:180px;border-radius:50%;
    background:rgba(255,255,255,.06);
  }
  .cc-top{display:flex;justify-content:space-between;align-items:flex-start;position:relative;z-index:1;}
  .cc-chip{width:36px;height:26px;border-radius:6px;background:linear-gradient(135deg,#FFE9B0,#E8C874);position:relative;}
  .cc-chip::before{content:'';position:absolute;top:5px;left:4px;right:4px;bottom:5px;border:1px solid rgba(0,0,0,.18);border-radius:3px;}
  .credit-card .icon-btn{color:rgba(255,255,255,.85);}
  .credit-card .icon-btn:hover{background:rgba(255,255,255,.16);color:#fff;}
  .cc-number{font-family:var(--font-display);font-size:16.5px;letter-spacing:2.5px;font-weight:500;position:relative;z-index:1;opacity:.95;}
  .cc-bottom{display:flex;justify-content:space-between;align-items:flex-end;position:relative;z-index:1;gap:10px;}
  .cc-label{font-size:11px;opacity:.8;margin-bottom:3px;}
  .cc-debt{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em;}
  .cc-name{font-size:12.5px;font-weight:600;opacity:.9;text-align:right;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- Filter bar ---------- */
  .filter-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;padding:14px;}
  .filter-bar select,.filter-bar input{flex:1;min-width:140px;}

  /* ---------- Forms ---------- */
  .field{margin-bottom:15px;}
  .field label{display:block;font-size:12.3px;font-weight:600;color:var(--text-secondary);margin-bottom:6px;}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .field-hint{font-size:12.3px;color:var(--text-secondary);margin-top:-8px;margin-bottom:16px;}
  input,select,textarea{
    width:100%;padding:10.5px 13px;border-radius:11px;border:1.5px solid var(--border);
    background:var(--surface-soft);font-family:var(--font-body);font-size:13.8px;color:var(--text);
    transition:border-color .15s,background .15s;
  }
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);background:#fff;}
  input[type=color]{padding:4px;height:42px;cursor:pointer;}

  .segmented{display:flex;background:var(--surface-soft);border-radius:12px;padding:4px;border:1px solid var(--border);margin-bottom:15px;}
  .segmented button{flex:1;padding:9px;border:none;background:transparent;border-radius:9px;font-weight:600;font-size:13.3px;color:var(--text-secondary);}
  .segmented button.active{background:#fff;box-shadow:0 1px 2px rgba(23,24,38,.08);}
  .segmented button.active[data-val="ingreso"]{color:#0F9E82;}
  .segmented button.active[data-val="gasto"]{color:#E1444B;}
  .segmented button.active[data-val="ahorro"]{color:var(--primary-dark);}
  .segmented button.active[data-val="tarjeta"]{color:var(--primary-dark);}
  .segmented button:disabled{opacity:.4;cursor:not-allowed;}

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(15,16,28,.46);backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:100;
    opacity:0;pointer-events:none;transition:opacity .15s;padding:20px;
  }
  .modal-overlay.active{opacity:1;pointer-events:auto;}
  .modal{
    background:var(--surface);border-radius:20px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;
    padding:24px;transform:translateY(10px) scale(.98);transition:transform .18s;
    box-shadow:0 30px 60px -14px rgba(0,0,0,.28);
  }
  .modal-overlay.active .modal{transform:translateY(0) scale(1);}
  .modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;}
  .modal-head h3{font-family:var(--font-display);font-size:16.5px;font-weight:700;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

  /* ---------- Empty states ---------- */
  .empty-state{text-align:center;padding:54px 22px;}
  .empty-icon{width:54px;height:54px;border-radius:16px;background:var(--primary-light);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;}
  .empty-icon svg{width:25px;height:25px;}
  .empty-state h3{font-family:var(--font-display);font-size:16.5px;margin-bottom:6px;}
  .empty-state p{color:var(--text-secondary);font-size:13.3px;max-width:380px;margin:0 auto 20px;}
  .empty-inline{text-align:center;padding:28px 10px;color:var(--text-tertiary);}
  .empty-inline svg{width:28px;height:28px;margin:0 auto 8px;}
  .empty-inline p{font-size:12.8px;color:var(--text-secondary);}

  /* ---------- Toast ---------- */
  .toast-container{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:100%;padding:0 16px;pointer-events:none;}
  .toast{
    background:#1E1F2E;color:#fff;padding:12px 18px;border-radius:12px;font-size:13.2px;font-weight:500;
    box-shadow:0 12px 26px rgba(0,0,0,.28);display:flex;align-items:center;gap:8px;
    transition:opacity .25s,transform .25s;max-width:340px;
  }
  .toast svg{width:16px;height:16px;flex-shrink:0;color:#1FBF9E;}
  .toast.error{background:#D93B3B;}
  .toast.error svg{color:#fff;}

  /* ---------- FAB ---------- */
  .fab{
    position:fixed;right:26px;bottom:26px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary),var(--teal));color:#fff;
    display:flex;align-items:center;justify-content:center;border:none;
    box-shadow:0 14px 28px -8px rgba(108,92,231,.65);z-index:45;transition:transform .15s;
  }
  .fab:hover{transform:scale(1.06);}
  .fab svg{width:24px;height:24px;}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{display:none;}
  .view[hidden]{display:none;}

  @media (max-width:900px){
    .charts-row{grid-template-columns:1fr;}
  }

  @media (max-width:768px){
    .sidebar{display:none;}
    .main{padding:18px 16px 96px;max-width:100%;}
    .fab{bottom:82px;right:16px;}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);
      border-top:1px solid var(--border);padding:7px 4px calc(6px + env(safe-area-inset-bottom));
      justify-content:space-around;z-index:40;
    }
    .bn-item{
      display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-tertiary);
      font-size:10px;font-weight:600;flex:1;padding:5px 2px;border-radius:10px;user-select:none;
    }
    .bn-item svg{width:19px;height:19px;}
    .bn-item.active{color:var(--primary);}
  }

  @media (max-width:480px){
    .field-row{grid-template-columns:1fr;}
    .page-title{font-size:21px;}
  }
</style>
</head>
<body>

<div id="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="brand-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/><path d="M17 12h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3a2 2 0 0 1 0-4Z"/></svg></span>
      <span class="brand-name">Mis Finanzas</span>
    </div>
    <nav class="nav">
      <div class="nav-item active" data-action="nav" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
        Resumen
      </div>
      <div class="nav-item" data-action="nav" data-view="cuentas">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h13a1 1 0 0 1 1 1v3"/><path d="M3 7v10a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/><path d="M17 12h3a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1h-3a2 2 0 0 1 0-4Z"/></svg>
        Cuentas
      </div>
      <div class="nav-item" data-action="nav" data-view="bolsillos">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.3 9.5c0-1.1 1.15-2 2.7-2s2.7.75 2.7 1.9c0 2.4-5.4 1.7-5.4 4.1 0 1.15 1.2 1.9 2.7 1.9s2.7-.9 2.7-2"/></svg>
        Bolsillos
      </div>
      <div class="nav-item" data-action="nav" data-view="transacciones">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
        Transacciones
      </div>
      <div class="nav-item" data-action="nav" data-view="categorias">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10 12.5 2.5a1 1 0 0 0-.7-.3H4a1 1 0 0 0-1 1v7.8a1 1 0 0 0 .3.7L10.8 19a2 2 0 0 0 2.8 0L20 12.8a2 2 0 0 0 0-2.8Z"/><circle cx="7.5" cy="7.5" r="1.3"/></svg>
        Categorías
      </div>
    </nav>
  </aside>

  <main class="main">
    <div class="topbar">
      <div>

const GOOGLE_CLIENT_ID = "295710642739-07s8lhtjvtsargk20gveo6cmi3f9lk9d.apps.googleusercontent.com";

/* =========================================================
   CONSTANTES
========================================================= */
const STORAGE_KEY = "mis_finanzas_data_v1";
const PALETTE = ["#6C5CE7","#1FBF9E","#4F8EF7","#FFB020","#FF6767","#A78BFA","#00B894","#E17055","#0984E3","#FD79A8"];
const MESES = ["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const ACCENTS = {
  teal:{bg:"var(--teal-light)",fg:"#0F9E82"},
  coral:{bg:"var(--coral-light)",fg:"#E1444B"},
  primary:{bg:"var(--primary-light)",fg:"var(--primary-dark)"},
  amber:{bg:"var(--amber-light)",fg:"#B4780A"},
  blue:{bg:"var(--blue-light)",fg:"#2E6FDB"}
};

function defaultCategories(){
  return [
    {id:"comida",name:"Comida",color:"#FF6767",predefined:true},
    {id:"transporte",name:"Transporte",color:"#4F8EF7",predefined:true},
    {id:"hogar",name:"Hogar",color:"#FFB020",predefined:true},
    {id:"entretenimiento",name:"Entretenimiento",color:"#A78BFA",predefined:true},
    {id:"salud",name:"Salud",color:"#1FBF9E",predefined:true},
    {id:"otros",name:"Otros",color:"#8B8DA1",predefined:true}
  ];
}

/* =========================================================
   ESTADO / PERSISTENCIA
========================================================= */
function normalizeState(raw){
  raw = raw || {};
  return {
    accounts: Array.isArray(raw.accounts) ? raw.accounts : [],
    pockets: Array.isArray(raw.pockets) ? raw.pockets : [],
    transactions: Array.isArray(raw.transactions) ? raw.transactions : [],
    categories: (Array.isArray(raw.categories) && raw.categories.length) ? raw.categories : defaultCategories(),
    updatedAt: raw.updatedAt || 0
  };
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){ return normalizeState(JSON.parse(raw)); }
  }catch(e){ console.error("Error al cargar datos guardados:", e); }
  return normalizeState(null);
}

let state = loadState();
function saveState(){
  state.updatedAt = Date.now();
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  catch(e){ console.error("Error al guardar datos:", e); toast("No se pudo guardar. Verifica el espacio disponible.","error"); }
  if(typeof driveState !== "undefined" && driveState.connected){
    driveState.dirty = true;
    scheduleDrivePush();
  }
}

/* Crea las categorías del sistema si no existen (usuarios nuevos y existentes) */
function ensureSystemCategories(){
  const ids = state.categories.map(c=>c.id);
  let changed = false;
  if(ids.indexOf("tarjetas_credito")===-1){
    state.categories.push({id:"tarjetas_credito", name:"Tarjetas de crédito", color:"#6C5CE7", predefined:true});
    changed = true;
  }
  if(ids.indexOf("transferencias")===-1){
    state.categories.push({id:"transferencias", name:"Transferencias", color:"#0984E3", predefined:true});
    changed = true;
  }
  return changed;
}

/* =========================================================
   UTILIDADES
========================================================= */
function uid(prefix){ return (prefix||"") + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function monthKey(dateStr){ return (dateStr||"").slice(0,7); }
function escapeHTML(s){
  if(s===null||s===undefined) return "";
  return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function formatMoney(n){
  n = Number(n)||0;
  const neg = n < -0.004;
  const abs = Math.abs(n);
  const str = abs.toLocaleString("es-PE",{minimumFractionDigits:2,maximumFractionDigits:2});
  return (neg?"-":"") + "S/ " + str;
}
function formatDateShort(s){
  if(!s) return "";
  const parts = s.split("-").map(Number);
  const d = parts[2], m = parts[1];
  return d + " " + (MESES[m-1]||"");
}
function maskDigits(id){
  let hash = 0;
  for(let i=0;i<id.length;i++){ hash = (hash*31 + id.charCodeAt(i)) >>> 0; }
  return String(hash % 10000).padStart(4,"0");
}

function getAccount(id){ return state.accounts.find(a=>a.id===id); }
function getCategory(id){ return state.categories.find(c=>c.id===id) || {id:"otros",name:"Otros",color:"#8B8DA1"}; }
function ahorroAccounts(){ return state.accounts.filter(a=>a.kind==="ahorro"); }
function tarjetaAccounts(){ return state.accounts.filter(a=>a.kind==="tarjeta"); }

function totalAhorrado(){
  const cuentas = ahorroAccounts().reduce((s,a)=>s+a.balance,0);
  const bolsillos = state.pockets.reduce((s,p)=>s+p.balance,0);
  return cuentas + bolsillos;
}
function totalDeuda(){ return tarjetaAccounts().reduce((s,a)=>s+a.debt,0); }

function transactionsInMonth(key){ return state.transactions.filter(t=>monthKey(t.date)===key && !t.system); }
function monthTotals(key){
  const txs = transactionsInMonth(key);
  const ingresos = txs.filter(t=>t.type==="ingreso").reduce((s,t)=>s+t.amount,0);
  const gastos = txs.filter(t=>t.type==="gasto").reduce((s,t)=>s+t.amount,0);
  return {ingresos, gastos, balance: ingresos-gastos};
}
function pctChange(cur,prev){
  if(prev===0){ return cur===0 ? null : null; }
  return ((cur-prev)/Math.abs(prev))*100;
}
function categorySpendData(){
  const curKey = new Date().toISOString().slice(0,7);
  const gastosMes = state.transactions.filter(t=>t.type==="gasto" && monthKey(t.date)===curKey && !t.system);
  const byCat = {};
  gastosMes.forEach(t=>{ byCat[t.categoryId] = (byCat[t.categoryId]||0) + t.amount; });
  const total = Object.values(byCat).reduce((s,v)=>s+v,0);
  return Object.entries(byCat)
    .map(([id,amount])=>({id, amount, pct: total ? (amount/total*100) : 0, cat:getCategory(id)}))
    .sort((a,b)=>b.amount-a.amount);
}

/* Aplica o revierte el efecto de una transacción sobre el saldo/deuda de su cuenta */
function applyTransactionEffect(t, sign){
  const acc = getAccount(t.accountId);
  if(!acc) return;
  if(t.type==="ingreso"){
    acc.balance += sign * t.amount;
  } else {
    if(acc.kind==="tarjeta"){ acc.debt += sign * t.amount; }
    else { acc.balance -= sign * t.amount; }
  }
}

/* Aplica crecimiento mensual compuesto a los bolsillos con tasa configurada */
function applyMonthlyGrowth(){
  const now = new Date();
  const curKey = now.toISOString().slice(0,7);
  let changed = false;
  state.pockets.forEach(p=>{
    if(p.rate && p.rate > 0){
      const last = p.lastGrowthApplied || monthKey(new Date(p.createdAt).toISOString());
      const [ly,lm] = last.split("-").map(Number);
      const [cy,cm] = curKey.split("-").map(Number);
      const diff = (cy-ly)*12 + (cm-lm);
      if(diff > 0){
        p.balance = p.balance * Math.pow(1 + p.rate/100, diff);
        p.lastGrowthApplied = curKey;
        changed = true;
      }
    }
  });
  if(changed) saveState();
}

const VIEWS = ["dashboard","cuentas","bolsillos","transacciones","categorias"];

};

function currentView(){
  return VIEWS.find(v=>{ const el=document.getElementById("view-"+v); return el && !el.hidden; }) || "dashboard";
}
function switchView(name){
  VIEWS.forEach(v=>{ document.getElementById("view-"+v).hidden = (v!==name); });
  document.querySelectorAll(".nav-item").forEach(el=>el.classList.toggle("active", el.dataset.view===name));
  document.querySelectorAll(".bn-item").forEach(el=>el.classList.toggle("active", el.dataset.view===name));
  document.getElementById("pageTitle").textContent = VIEW_TITLES[name].title;
  document.getElementById("pageSub").textContent = VIEW_TITLES[name].sub;
  renderView(name);
  window.scrollTo({top:0,behavior:"instant"});
}
function renderView(name){
  if(name==="dashboard") renderDashboard();
  else if(name==="cuentas") renderCuentas();
  else if(name==="bolsillos") renderBolsillos();
  else if(name==="transacciones") renderTransacciones();
  else if(name==="categorias") renderCategorias();
}
function refresh(){ renderView(currentView()); }

    extra = `<span class="trend-pill ${up?'trend-up':'trend-down'}">${up?ICONS.trendUp:ICONS.trendDown}${up?'+':''}${trendPct.toFixed(1)}%</span>`;

    extra = `<span class="stat-sub">${subtext}</span>`;

  return `<div class="card stat-card">
    <span class="stat-icon" style="background:${a.bg};color:${a.fg}">${ICONS[iconKey]}</span>
    <div class="stat-label">${label}</div>
    <div class="stat-value">${value}</div>
    ${extra}
  </div>`;
}

      lineChartRange = parseInt(e.target.value, 10) || 6;

    });

function renderLineChart(){
  const canvas = document.getElementById("lineChart");
  if(!canvas) return;
  const now = new Date();
  const months = [];
  for(let i=lineChartRange-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    months.push({key: d.toISOString().slice(0,7), label: MESES[d.getMonth()]});
  }
  const ingresosData = months.map(m=>monthTotals(m.key).ingresos);
  const gastosData = months.map(m=>monthTotals(m.key).gastos);

  if(charts.line){ charts.line.destroy(); charts.line=null; }
  const ctx = canvas.getContext("2d");
  const tealGrad = ctx.createLinearGradient(0,0,0,230);
  tealGrad.addColorStop(0,"rgba(31,191,158,.28)");
  tealGrad.addColorStop(1,"rgba(31,191,158,0)");
  const coralGrad = ctx.createLinearGradient(0,0,0,230);
  coralGrad.addColorStop(0,"rgba(255,103,103,.24)");
  coralGrad.addColorStop(1,"rgba(255,103,103,0)");

  charts.line = new Chart(canvas, {
    type:"line",
    data:{
      labels: months.map(m=>m.label),
      datasets:[
        {label:"Ingresos", data:ingresosData, borderColor:"#1FBF9E", backgroundColor:tealGrad, fill:true, tension:.4, pointRadius:3, pointHoverRadius:5, pointBackgroundColor:"#1FBF9E", borderWidth:2.5},
        {label:"Gastos", data:gastosData, borderColor:"#FF6767", backgroundColor:coralGrad, fill:true, tension:.4, pointRadius:3, pointHoverRadius:5, pointBackgroundColor:"#FF6767", borderWidth:2.5}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:"index", intersect:false},
      plugins:{
        legend:{display:true, position:"top", align:"end", labels:{boxWidth:8, boxHeight:8, usePointStyle:true, pointStyle:"circle", font:{family:"Inter", size:12, weight:"600"}, color:"#8B8DA1", padding:16}},
        tooltip:{backgroundColor:"#1E1F2E", padding:10, cornerRadius:10, titleFont:{family:"Outfit", weight:"600"}, bodyFont:{family:"Inter"}, callbacks:{ label:(c)=> " " + c.dataset.label + ": " + formatMoney(c.raw) }}
      },
      scales:{
        x:{ grid:{display:false}, ticks:{color:"#B7B9CC", font:{family:"Inter", size:11.5}} },
        y:{ grid:{color:"#EEF0F8"}, border:{display:false}, ticks:{color:"#B7B9CC", font:{family:"Inter", size:11}, callback:(v)=> v>=1000 ? "S/ "+(v/1000)+"k" : "S/ "+v } }
      }
    }
  });
}

function renderDonutChart(catData){
  const canvas = document.getElementById("donutChart");
  if(!canvas) return;
  if(charts.donut){ charts.donut.destroy(); charts.donut=null; }
  charts.donut = new Chart(canvas, {
    type:"doughnut",
    data:{
      labels: catData.map(c=>c.cat.name),
      datasets:[{ data: catData.map(c=>c.amount), backgroundColor: catData.map(c=>c.cat.color), borderWidth:0, hoverOffset:6 }]

    options:{
      responsive:true, maintainAspectRatio:false, cutout:"72%",
      plugins:{
        legend:{display:false},
        tooltip:{backgroundColor:"#1E1F2E", padding:10, cornerRadius:10, callbacks:{ label:(c)=> " " + c.label + ": " + formatMoney(c.raw) }}
      }

}

  return state.transactions.filter(t=>{
    if(txFilters.type!=="todos" && t.type!==txFilters.type) return false;
    if(txFilters.accountId!=="todos" && t.accountId!==txFilters.accountId) return false;

   MODALES
========================================================= */
function overlayEl(){ return document.getElementById("modalOverlay"); }
function modalBoxEl(){ return document.getElementById("modalBox"); }

function openModal(html){
  modalBoxEl().innerHTML = html;
  overlayEl().classList.add("active");
  document.body.style.overflow = "hidden";
  const firstInput = modalBoxEl().querySelector("input,select,textarea");
  if(firstInput){ setTimeout(()=>firstInput.focus(), 60); }
}
function closeModal(){
  overlayEl().classList.remove("active");
  document.body.style.overflow = "";
  pendingAction = null;
  setTimeout(()=>{ modalBoxEl().innerHTML = ""; }, 200);
}

/* ---- Modal: Cuenta ---- */
function modalCuenta(existing){
  const isEdit = !!existing;
  const kind = existing ? existing.kind : "ahorro";
  const amountVal = existing ? (existing.kind==="tarjeta" ? existing.debt : existing.balance).toFixed(2) : "";
  openModal(`
    <div class="modal-head"><h3>${isEdit?"Editar cuenta":"Nueva cuenta"}</h3><button class="icon-btn" data-action="close-modal">${ICONS.x}</button></div>
    <form id="form-cuenta" data-id="${existing?existing.id:''}">
      <div class="field">
        <label>Tipo de cuenta</label>
        <div class="segmented" id="cuentaTipoSeg">
          <button type="button" data-val="ahorro" class="${kind==='ahorro'?'active':''}" ${isEdit&&kind!=='ahorro'?'disabled':''}>Ahorros</button>
          <button type="button" data-val="tarjeta" class="${kind==='tarjeta'?'active':''}" ${isEdit&&kind!=='tarjeta'?'disabled':''}>Tarjeta de crédito</button>
        </div>
        <input type="hidden" name="kind" value="${kind}">
      </div>
      <div class="field">
        <label>Nombre de la cuenta</label>
        <input type="text" name="name" placeholder="Ej. Cuenta principal" value="${existing?escapeHTML(existing.name):''}" required maxlength="40">
      </div>
      <div class="field">
        <label id="montoLabel">${kind==='tarjeta'?'Deuda actual':'Saldo actual'}</label>
        <input type="number" inputmode="decimal" name="amount" step="0.01" min="0" value="${amountVal}" placeholder="0.00" required>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">${isEdit?'Guardar cambios':'Crear cuenta'}</button>
      </div>
    </form>
  `);
  if(!isEdit){
    document.querySelectorAll("#cuentaTipoSeg button").forEach(b=>{
      b.addEventListener("click", ()=>{
        document.querySelectorAll("#cuentaTipoSeg button").forEach(x=>x.classList.remove("active"));
        b.classList.add("active");
        document.querySelector('#form-cuenta input[name=kind]').value = b.dataset.val;
        document.getElementById("montoLabel").textContent = b.dataset.val==="tarjeta" ? "Deuda actual" : "Saldo actual";
      });
    });
  }
}

function handleCuentaSubmit(form){
  const id = form.dataset.id;
  const kind = form.kind.value;
  const name = form.name.value.trim();
  const amount = parseFloat(form.amount.value);
  if(!name){ toast("Ingresa un nombre para la cuenta.","error"); return; }
  if(isNaN(amount) || amount < 0){ toast("Ingresa un monto válido.","error"); return; }

  if(id){
    const acc = getAccount(id);
    acc.name = name;
    if(kind==="tarjeta"){ acc.debt = amount; } else { acc.balance = amount; }
    toast("Cuenta actualizada.");
  } else {
    const acc = {id:uid("acc_"), kind, name, createdAt:Date.now()};
    if(kind==="tarjeta"){ acc.debt = amount; } else { acc.balance = amount; }
    state.accounts.push(acc);
    toast("Cuenta creada.");
  }
  saveState(); closeModal(); refresh();
}

function handlePocketSubmit(form){
  const id = form.dataset.id;
  const name = form.name.value.trim();
  const rateRaw = form.rate.value;
  const rate = rateRaw==="" ? null : parseFloat(rateRaw);
  const amount = parseFloat(form.amount.value) || 0;
  if(!name){ toast("Ingresa un nombre para el bolsillo.","error"); return; }
  if(rate!==null && (isNaN(rate) || rate<0 || rate>100)){ toast("La tasa debe ser un número entre 0 y 100.","error"); return; }

  if(id){
    const p = state.pockets.find(x=>x.id===id);
    p.name = name; p.rate = rate; p.balance = amount;
    toast("Bolsillo actualizado.");
  } else {
    const curKey = new Date().toISOString().slice(0,7);
    state.pockets.push({id:uid("pkt_"), name, rate, balance:amount, createdAt:Date.now(), lastGrowthApplied:curKey});
    toast("Bolsillo creado.");
  }
  saveState(); closeModal(); refresh();
}

function handleMeterSacarSubmit(form){
  const id = form.dataset.id;
  const mode = form.dataset.mode;
  const amount = parseFloat(form.amount.value);
  const accountId = form.accountId.value;
  if(isNaN(amount) || amount<=0){ toast("Ingresa un monto válido.","error"); return; }
  const p = state.pockets.find(x=>x.id===id);
  if(!p) return;
  if(mode==="sacar" && amount > p.balance){ toast("El bolsillo no tiene suficiente saldo.","error"); return; }

  if(accountId){
    const acc = getAccount(accountId);
    if(acc){
      if(mode==="meter"){
        if(amount > acc.balance){ toast("Saldo insuficiente en la cuenta seleccionada.","error"); return; }
        acc.balance -= amount;
      } else {
        acc.balance += amount;
      }
    }
  }
  p.balance += (mode==="meter" ? amount : -amount);
  saveState(); closeModal();
  toast(mode==="meter" ? "Dinero agregado al bolsillo." : "Dinero retirado del bolsillo.");
  refresh();
}

function handlePagarTarjetaSubmit(form){
  const cardId = form.dataset.id;
  const amount = parseFloat(form.amount.value);
  const accountId = form.accountId.value;
  if(isNaN(amount) || amount<=0){ toast("Ingresa un monto válido.","error"); return; }
  const card = getAccount(cardId);
  const acc = getAccount(accountId);
  if(!card || !acc) return;
  if(amount > acc.balance){ toast("Saldo insuficiente en la cuenta seleccionada.","error"); return; }

  const pagoReal = Math.min(amount, card.debt);
  if(pagoReal <= 0){ toast("Esta tarjeta no tiene deuda pendiente.","error"); return; }

  if(ensureSystemCategories()) saveState();
  const t = {
    id: uid("tx_"), type:"gasto", amount: pagoReal, date: todayStr(),
    description: "Pago de tarjeta — " + card.name,
    categoryId: "tarjetas_credito", accountId: accountId, createdAt: Date.now(),
    system: {kind:"pago_tarjeta", cardId: cardId, debtAmount: pagoReal}
  };
  applyTransactionEffect(t, 1); // descuenta el saldo de la cuenta de ahorros
  card.debt -= pagoReal;
  state.transactions.push(t);

  saveState(); closeModal();
  toast(pagoReal < amount ? ("Se pagó el total de la deuda: " + formatMoney(pagoReal)) : "Pago realizado correctamente.");
  refresh();
}

/* ---- Confirmación de eliminación ---- */
let pendingAction = null;

function askConfirm(opts){
  pendingAction = {type: opts.type, id: opts.id, payload: opts.payload};
  openModal(`
    <div class="modal-head"><h3>${opts.title}</h3><button class="icon-btn" data-action="close-modal">${ICONS.x}</button></div>
    <p class="field-hint" style="margin-bottom:22px;">${opts.message}</p>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-action="close-modal">Cancelar</button>
      <button type="button" class="btn ${opts.danger===false?'btn-primary':'btn-danger'}" data-action="confirm-delete">${opts.icon||ICONS.trash} ${opts.confirmLabel||'Eliminar'}</button>
    </div>
  `);
}

function askDelete(type, id, message){
  askConfirm({type, id, title:"¿Eliminar?", message, confirmLabel:"Eliminar", icon:ICONS.trash, danger:true});
}

function confirmDelete(){
  if(!pendingAction) return;
  const {type, id} = pendingAction;

  if(type==="account"){
    state.transactions = state.transactions.filter(t=>t.accountId!==id);
    state.accounts = state.accounts.filter(a=>a.id!==id);
    toast("Cuenta eliminada.");
  } else if(type==="pocket"){
    state.pockets = state.pockets.filter(p=>p.id!==id);
    toast("Bolsillo eliminado.");
  } else if(type==="tx"){
    const t = state.transactions.find(x=>x.id===id);
    if(t){
      applyTransactionEffect(t, -1);
      if(t.system && t.system.kind==="pago_tarjeta"){
        const card = getAccount(t.system.cardId);
        if(card){ card.debt += t.system.debtAmount; }
      }
      if(t.system && t.system.kind==="transferencia" && t.system.groupId){
        const partner = state.transactions.find(x=> x.system && x.system.groupId===t.system.groupId && x.id!==t.id);
        if(partner){
          applyTransactionEffect(partner, -1);
          state.transactions = state.transactions.filter(x=>x.id!==partner.id);
        }
      }
      state.transactions = state.transactions.filter(x=>x.id!==id);
    }
    toast("Transacción eliminada.");
  } else if(type==="category"){
    const fallback = state.categories.find(c=>c.id==="otros") || state.categories.find(c=>c.id!==id) || null;
    if(fallback){
      state.transactions.forEach(t=>{ if(t.categoryId===id) t.categoryId = fallback.id; });
    }
    state.categories = state.categories.filter(c=>c.id!==id);
    toast("Categoría eliminada.");
  } else if(type==="import-data"){
    state = normalizeState(pendingAction.payload);
    ensureSystemCategories();
    toast("Datos importados correctamente.");
  }
  saveState(); closeModal(); refresh();
}

/* =========================================================

========================================================= */
function toast(msg, type){
  const container = document.getElementById("toastContainer");
  const el = document.createElement("div");
  el.className = "toast" + (type==="error" ? " error" : "");
  el.innerHTML = `${type==="error"?ICONS.alert:ICONS.check}<span>${escapeHTML(msg)}</span>`;
  container.appendChild(el);
  setTimeout(()=>{
    el.style.opacity = "0";
    el.style.transform = "translateY(8px)";
    setTimeout(()=>el.remove(), 260);
  }, 2700);
}

function timeAgo(ts){
  if(!ts) return "nunca";
  const diff = Math.max(0, Date.now()-ts);
  const s = Math.floor(diff/1000);
  if(s<5) return "justo ahora";
  if(s<60) return "hace " + s + "s";
  const m = Math.floor(s/60);
  if(m<60) return "hace " + m + "min";
  const h = Math.floor(m/60);
  if(h<24) return "hace " + h + "h";
  const d = Math.floor(h/24);
  return "hace " + d + "d";
}

/* ---- Exportar / Importar (Excel) ---- */
function exportToExcel(){
  if(typeof XLSX === "undefined"){ toast("No se pudo cargar el motor de Excel. Revisa tu conexión a internet.","error"); return; }
  try{
    const now = new Date();
    const curKey = now.toISOString().slice(0,7);
    const cur = monthTotals(curKey);

    const wsResumen = XLSX.utils.aoa_to_sheet([
      ["Mis Finanzas — Resumen"],
      ["Generado el", now.toLocaleString("es-PE")],
      [],
      ["Ingresos del mes", cur.ingresos],
      ["Gastos del mes", cur.gastos],
      ["Balance del mes", cur.balance],
      ["Deuda total en tarjetas", totalDeuda()],
      ["Total ahorrado (cuentas + bolsillos)", totalAhorrado()]
    ]);

    const txRows = [...state.transactions]
      .sort((a,b)=> a.date.localeCompare(b.date) || (a.createdAt-b.createdAt))
      .map(t=>{
        const cat = getCategory(t.categoryId);
        const acc = getAccount(t.accountId);
        return [t.date, t.type==="ingreso"?"Ingreso":"Gasto", t.description||"", cat.name, acc?acc.name:"—", t.amount];
      });
    const wsTx = XLSX.utils.aoa_to_sheet([["Fecha","Tipo","Descripción","Categoría","Cuenta","Monto"], ...txRows]);

    const accRows = state.accounts.map(a=> a.kind==="tarjeta"
      ? [a.name, "Tarjeta de crédito", "", a.debt]
      : [a.name, "Ahorros", a.balance, ""]);
    const wsAcc = XLSX.utils.aoa_to_sheet([["Nombre","Tipo","Saldo","Deuda"], ...accRows]);

    const pktRows = state.pockets.map(p=> [p.name, p.balance, p.rate!=null ? (p.rate+"%") : "Sin crecimiento"]);
    const wsPkt = XLSX.utils.aoa_to_sheet([["Nombre","Saldo","Tasa mensual"], ...pktRows]);

    const catRows = state.categories.map(c=> [c.name, categoryTotal(c)]);
    const wsCat = XLSX.utils.aoa_to_sheet([["Categoría","Total"], ...catRows]);

    // Sheet técnica: respaldo completo en JSON, partido en bloques por si supera el límite de una celda
    const json = JSON.stringify(state);
    const CHUNK = 30000;
    const chunks = [];
    for(let i=0;i<json.length;i+=CHUNK){ chunks.push([json.slice(i,i+CHUNK)]); }
    const wsBackup = XLSX.utils.aoa_to_sheet([["MIS_FINANZAS_BACKUP_V1"], ...chunks]);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, wsResumen, "Resumen");
    XLSX.utils.book_append_sheet(wb, wsTx, "Transacciones");
    XLSX.utils.book_append_sheet(wb, wsAcc, "Cuentas");
    XLSX.utils.book_append_sheet(wb, wsPkt, "Bolsillos");
    XLSX.utils.book_append_sheet(wb, wsCat, "Categorías");
    XLSX.utils.book_append_sheet(wb, wsBackup, "Backup");

    const filename = "mis-finanzas-" + todayStr() + ".xlsx";
    XLSX.writeFile(wb, filename);
    toast("Excel exportado: " + filename);
  }catch(e){
    console.error(e);
    toast("No se pudo exportar el archivo.","error");
  }
}

function handleImportFile(file){
  if(typeof XLSX === "undefined"){ toast("No se pudo cargar el motor de Excel. Revisa tu conexión a internet.","error"); return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:"array"});
      const sheet = wb.Sheets["Backup"];
      if(!sheet || !sheet["!ref"]){ toast("Este archivo no contiene datos de respaldo válidos de Mis Finanzas.","error"); return; }
      const marker = sheet["A1"] ? sheet["A1"].v : null;
      if(marker !== "MIS_FINANZAS_BACKUP_V1"){ toast("Este archivo no es un respaldo válido de Mis Finanzas.","error"); return; }

      const range = XLSX.utils.decode_range(sheet["!ref"]);
      let json = "";
      for(let r=1; r<=range.e.r; r++){
        const cell = sheet[XLSX.utils.encode_cell({r:r, c:0})];
        if(cell && cell.v) json += cell.v;
      }
      if(!json){ toast("El archivo de respaldo está vacío o dañado.","error"); return; }

      const parsed = JSON.parse(json);
      if(!parsed || typeof parsed !== "object"){ throw new Error("formato inválido"); }

      askConfirm({
        type:"import-data",
        payload: parsed,
        title:"¿Reemplazar todos tus datos?",
        message:`Vas a importar "${escapeHTML(file.name)}". Esto reemplazará TODAS tus cuentas, transacciones, bolsillos y categorías actuales con los datos del archivo. Esta acción no se puede deshacer.`,
        confirmLabel:"Sí, reemplazar mis datos",
        icon: ICONS.check,
        danger: true
      });
    }catch(err){
      console.error(err);
      toast("No se pudo leer el archivo. Asegúrate de que sea un Excel exportado desde esta misma app.","error");
    }
  };
  reader.onerror = function(){ toast("No se pudo leer el archivo.","error"); };
  reader.readAsArrayBuffer(file);
}

function modalSync(){
  let body;
  if(!GOOGLE_CLIENT_ID){
    body = `
      <p class="field-hint" style="margin-bottom:14px;">La sincronización con Google Drive no está configurada todavía en este archivo.</p>
      <div class="card" style="background:var(--surface-soft);border-style:dashed;font-size:12.6px;line-height:1.65;padding:16px;">
        <strong>Para activarla:</strong>
        <ol style="margin:10px 0 0 18px;padding:0;">
          <li>Crea credenciales OAuth (tipo "Aplicación web") en Google Cloud Console.</li>
          <li>Agrega como origen autorizado la URL https:// donde alojes este archivo.</li>
          <li>Copia el "Client ID" y pégalo en la constante <code style="background:var(--border);padding:1px 5px;border-radius:5px;font-family:monospace;">GOOGLE_CLIENT_ID</code>, al inicio del archivo.</li>
          <li>Vuelve a abrir la app.</li>
        </ol>
      </div>
    `;
  } else if(!driveState.connected){
    body = `
      <p class="field-hint" style="margin-bottom:18px;">Conecta tu cuenta de Google para respaldar tus datos y verlos en todos tus dispositivos automáticamente.</p>
      <button type="button" class="btn btn-primary btn-block" data-action="drive-connect">${ICONS.cloud} Conectar con Google Drive</button>
    `;
  } else {
    body = `
      <p class="field-hint" style="margin-bottom:4px;">Conectado como <strong style="color:var(--text);">${escapeHTML(driveState.email||"tu cuenta de Google")}</strong></p>
      <p class="field-hint" style="margin-bottom:20px;">Última sincronización: ${timeAgo(driveState.lastSync)}</p>
      <div class="modal-actions" style="justify-content:space-between;">
        <button type="button" class="btn btn-danger btn-sm" data-action="drive-disconnect">Desconectar</button>
        <button type="button" class="btn btn-primary btn-sm" data-action="drive-sync-now">${ICONS.sync} Sincronizar ahora</button>
      </div>
    `;
  }
  openModal(`
    <div class="modal-head"><h3>Sincronización con Google Drive</h3><button class="icon-btn" data-action="close-modal">${ICONS.x}</button></div>
    ${body}
    <div class="card" style="background:var(--surface-soft);margin-top:18px;padding:16px;">
      <p class="field-hint" style="margin-bottom:10px;">Respaldo local en Excel</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <button type="button" class="btn btn-ghost btn-sm" data-action="export-excel">${ICONS.download} Exportar a Excel</button>
        <button type="button" class="btn btn-ghost btn-sm" data-action="import-excel-trigger">${ICONS.upload} Importar datos</button>
      </div>
      <p class="field-hint" style="margin:10px 0 0;">El archivo exportado sirve tanto para revisar tus datos en Excel como para volver a importarlos después.</p>
      <input type="file" id="importFileInput" accept=".xlsx" style="display:none;">
    </div>
  `);
  const importInput = document.getElementById("importFileInput");
  if(importInput){
    importInput.addEventListener("change", (e)=>{
      const file = e.target.files[0];
      if(file) handleImportFile(file);
      e.target.value = "";
    });
  }
}

function waitForGoogleIdentity(cb, attempts){
  attempts = attempts || 0;
  if(window.google && window.google.accounts && window.google.accounts.oauth2){ cb(); }
  else if(attempts < 40){ setTimeout(function(){ waitForGoogleIdentity(cb, attempts+1); }, 250); }
}

function initGoogleAuth(){
  if(!GOOGLE_CLIENT_ID) return;
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email",
    callback: async function(resp){
      if(!resp || resp.error){
        if(resp && resp.error !== "popup_closed"){ toast("No se pudo conectar con Google Drive.","error"); }
        return;
      }
      driveState.accessToken = resp.access_token;
      driveState.connected = true;
      driveState.syncing = true;
      updateSyncBadge();
      await fetchDriveUserEmail();
      await ensureDriveFile();
      await pullFromDrive();
      if(driveState.fileId){
        driveState.dirty = true;
        await pushToDrive();
      }
      localStorage.setItem("driveConnected","1");
      driveState.syncing = false;
      updateSyncBadge();
      if(overlayEl().classList.contains("active")) modalSync();
      toast("Conectado a Google Drive.");
    }
  });
}

function connectDrive(){
  if(!GOOGLE_CLIENT_ID){ toast("Primero configura el Client ID de Google (ver instrucciones).","error"); return; }
  if(!tokenClient){ toast("Google todavía se está cargando, intenta en unos segundos.","error"); return; }
  tokenClient.requestAccessToken();
}

function disconnectDrive(){
  if(driveState.accessToken && window.google){
    try{ google.accounts.oauth2.revoke(driveState.accessToken, function(){}); }catch(e){}
  }
  driveState.connected = false;
  driveState.accessToken = null;
  driveState.email = null;
  driveState.dirty = false;
  driveState.syncing = false;
  localStorage.removeItem("driveConnected");
  updateSyncBadge();
  if(overlayEl().classList.contains("active")) modalSync();
  toast("Desconectado de Google Drive.");
}

async function driveFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, {Authorization: "Bearer " + driveState.accessToken});
  const res = await fetch(url, options);
  if(res.status === 401){
    driveState.connected = false;
    driveState.accessToken = null;
    updateSyncBadge();
    toast("Tu sesión de Google Drive expiró. Reconéctate para seguir sincronizando.","error");
    throw new Error("token_expired");
  }
  return res;
}

async function fetchDriveUserEmail(){
  try{
    const res = await driveFetch("https://www.googleapis.com/oauth2/v3/userinfo");
    if(res.ok){ const data = await res.json(); driveState.email = data.email || null; }
  }catch(e){}
}

async function ensureDriveFile(){
  if(driveState.fileId){
    try{
      const res = await driveFetch("https://www.googleapis.com/drive/v3/files/" + driveState.fileId + "?fields=id,trashed");
      if(res.ok){
        const data = await res.json();
        if(!data.trashed) return;
      }
    }catch(e){ return; }
    driveState.fileId = null;
    localStorage.removeItem("driveFileId");
  }
  try{
    const q = encodeURIComponent("name='" + DRIVE_FILE_NAME + "' and trashed=false");
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files?q=" + q + "&spaces=drive&fields=files(id,name)");
    if(res.ok){
      const data = await res.json();
      if(data.files && data.files.length){
        driveState.fileId = data.files[0].id;
        localStorage.setItem("driveFileId", driveState.fileId);
        return;
      }
    }
  }catch(e){ return; }
  try{
    const createRes = await driveFetch("https://www.googleapis.com/drive/v3/files", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({name: DRIVE_FILE_NAME, mimeType:"application/json"})
    });
    if(createRes.ok){
      const data = await createRes.json();
      driveState.fileId = data.id;
      localStorage.setItem("driveFileId", driveState.fileId);
    }
  }catch(e){}
}

async function driveGetFileContent(fileId){
  if(!fileId) return null;
  try{
    const res = await driveFetch("https://www.googleapis.com/drive/v3/files/" + fileId + "?alt=media");
    if(res.ok) return await res.text();
  }catch(e){}
  return null;
}

async function driveUpdateFileContent(fileId, contentStr){
  if(!fileId) return false;
  try{
    const res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files/" + fileId + "?uploadType=media", {
      method:"PATCH",
      headers:{"Content-Type":"application/json"},
      body: contentStr
    });
    return res.ok;
  }catch(e){ return false; }
}

async function pullFromDrive(){
  if(!driveState.connected || !driveState.fileId) return;
  try{
    const content = await driveGetFileContent(driveState.fileId);
    if(!content) return;
    let remote;
    try{ remote = JSON.parse(content); }catch(e){ return; }
    if(!remote || typeof remote.updatedAt !== "number") return;
    if(remote.updatedAt > (state.updatedAt||0)){
      state = {
        accounts: remote.accounts||[],
        pockets: remote.pockets||[],
        transactions: remote.transactions||[],
        categories: (remote.categories&&remote.categories.length)?remote.categories:defaultCategories(),
        updatedAt: remote.updatedAt
      };
      ensureSystemCategories();
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      applyMonthlyGrowth();
      refresh();
      toast("Datos actualizados desde Google Drive.");
    }
  }catch(e){ /* fallo silencioso: red u otro; se reintenta en el próximo ciclo */ }
}

async function pushToDrive(){
  if(!driveState.connected || !driveState.fileId || !driveState.dirty) return;
  try{
    const ok = await driveUpdateFileContent(driveState.fileId, JSON.stringify(state));
    if(ok){ driveState.dirty = false; driveState.lastSync = Date.now(); }
  }catch(e){ /* se reintentará en el próximo ciclo */ }
}

function scheduleDrivePush(){
  clearTimeout(drivePushTimer);
  drivePushTimer = setTimeout(async function(){
    driveState.syncing = true; updateSyncBadge();
    await pushToDrive();
    driveState.syncing = false; updateSyncBadge();
  }, 2500);
}

async function driveSyncNow(){
  if(!driveState.connected){ toast("No estás conectado a Google Drive.","error"); return; }
  driveState.syncing = true; updateSyncBadge();
  await pullFromDrive();
  await pushToDrive();
  driveState.syncing = false;
  driveState.lastSync = driveState.lastSync || Date.now();
  updateSyncBadge();
  if(overlayEl().classList.contains("active")) modalSync();
  toast("Sincronización completada.");
}

/* =========================================================
   EVENTOS GLOBALES (delegación)
========================================================= */
document.addEventListener("submit", function(e){
  if(e.target.id==="form-cuenta"){ e.preventDefault(); handleCuentaSubmit(e.target); }
  else if(e.target.id==="form-pocket"){ e.preventDefault(); handlePocketSubmit(e.target); }
  else if(e.target.id==="form-tx"){ e.preventDefault(); handleTxSubmit(e.target); }
  else if(e.target.id==="form-category"){ e.preventDefault(); handleCategorySubmit(e.target); }
  else if(e.target.id==="form-meter-sacar"){ e.preventDefault(); handleMeterSacarSubmit(e.target); }
  else if(e.target.id==="form-pagar-tarjeta"){ e.preventDefault(); handlePagarTarjetaSubmit(e.target); }
  else if(e.target.id==="form-transfer"){ e.preventDefault(); handleTransferSubmit(e.target); }
});

document.addEventListener("click", function(e){
  const btn = e.target.closest("[data-action]");
  if(!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;

  switch(action){
    case "nav": switchView(btn.dataset.view); break;
    case "close-modal": closeModal(); break;
    case "confirm-delete": confirmDelete(); break;

    case "new-account": modalCuenta(null); break;
    case "edit-account": modalCuenta(getAccount(id)); break;
    case "delete-account": {
      const acc = getAccount(id);
      if(!acc) break;
      const txCount = state.transactions.filter(t=>t.accountId===id).length;
      askDelete("account", id, txCount>0
        ? `Esta cuenta tiene ${txCount} transacción(es) asociada(s). Si la eliminas, también se eliminarán. Esta acción no se puede deshacer.`
        : `Vas a eliminar "${escapeHTML(acc.name)}". Esta acción no se puede deshacer.`);
      break;
    }

    case "new-pocket": modalPocket(null); break;
    case "edit-pocket": modalPocket(state.pockets.find(p=>p.id===id)); break;
    case "delete-pocket": {
      const p = state.pockets.find(x=>x.id===id);
      if(!p) break;
      askDelete("pocket", id, p.balance>0
        ? `Este bolsillo tiene ${formatMoney(p.balance)}. Al eliminarlo, ese registro se perderá. Esta acción no se puede deshacer.`
        : `Vas a eliminar "${escapeHTML(p.name)}". Esta acción no se puede deshacer.`);
      break;
    }
    case "meter-bolsillo": modalMeterSacar(id, "meter"); break;
    case "sacar-bolsillo": modalMeterSacar(id, "sacar"); break;
    case "pagar-tarjeta": modalPagarTarjeta(id); break;
    case "new-transfer": modalTransfer(); break;

    case "open-sync": {
      if(GOOGLE_CLIENT_ID && !driveState.connected && tokenClient){ connectDrive(); }
      else { modalSync(); }
      break;
    }
    case "drive-connect": connectDrive(); break;
    case "drive-sync-now": driveSyncNow(); break;
    case "drive-disconnect": disconnectDrive(); break;
    case "export-excel": exportToExcel(); break;
    case "import-excel-trigger": {
      const inp = document.getElementById("importFileInput");
      if(inp) inp.click();
      break;
    }

    case "new-tx": modalTransaccion(null); break;
    case "edit-tx": modalTransaccion(state.transactions.find(t=>t.id===id)); break;
    case "delete-tx": {
      const t = state.transactions.find(x=>x.id===id);
      let msg = "Vas a eliminar esta transacción. Esta acción no se puede deshacer.";
      if(t && t.system && t.system.kind==="pago_tarjeta") msg = "Esto también restaurará la deuda de la tarjeta por " + formatMoney(t.system.debtAmount) + ". Esta acción no se puede deshacer.";
      if(t && t.system && t.system.kind==="transferencia") msg = "Esto eliminará ambos movimientos de la transferencia (origen y destino). Esta acción no se puede deshacer.";
      askDelete("tx", id, msg);
      break;
    }

    case "new-category": modalCategory(null); break;
    case "edit-category": modalCategory(state.categories.find(c=>c.id===id)); break;
    case "delete-category": {
      if(state.categories.length<=1){ toast("Debe existir al menos una categoría.","error"); break; }
      const c = state.categories.find(x=>x.id===id);
      if(!c) break;
      const count = state.transactions.filter(t=>t.categoryId===id).length;
      askDelete("category", id, count>0
        ? `${count} transacción(es) usan esta categoría y pasarán a "Otros". ¿Deseas continuar?`
        : `Vas a eliminar "${escapeHTML(c.name)}".`);
      break;
    }
  }
});

document.getElementById("modalOverlay").addEventListener("click", function(e){
  if(e.target.id==="modalOverlay") closeModal();
});
document.addEventListener("keydown", function(e){
  if(e.key==="Escape") closeModal();
});
document.getElementById("fab").addEventListener("click", ()=> modalTransaccion(null));

/* =========================================================
   INICIO
========================================================= */
function init(){
  if(ensureSystemCategories()) saveState();
  applyMonthlyGrowth();
  driveState.fileId = localStorage.getItem("driveFileId") || null;
  updateSyncBadge();
  switchView("dashboard");

  waitForGoogleIdentity(function(){
    initGoogleAuth();
    if(localStorage.getItem("driveConnected")==="1" && tokenClient){
      setTimeout(function(){ tokenClient.requestAccessToken({prompt:""}); }, 400);
    }
  });

  setInterval(function(){
    if(driveState.connected && !driveState.syncing){
      pullFromDrive();
      if(driveState.dirty) pushToDrive();
    }
  }, 20000);

  document.addEventListener("visibilitychange", function(){
    if(!document.hidden && driveState.connected) pullFromDrive();
  });
  window.addEventListener("focus", function(){
    if(driveState.connected) pullFromDrive();
  });
}
init();

</script>
